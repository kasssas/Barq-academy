name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare safe CI environment configuration
        run: |
          # The local config/app.env is intentionally untracked.
          # For CI, we use the safe example template to provide standard
          # predictable paths and credentials without exposing real secrets.
          cp config/app.env.example config/app.env

          # Our docker-compose.yml expects BARQ_POSTGRES_PASSWORD in the host environment.
          # Exporting the dummy 'change_me_password' to satisfy this safely.
          echo "BARQ_POSTGRES_PASSWORD=change_me_password" >> $GITHUB_ENV

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build Docker images
        run: docker compose build

      - name: Start environment
        run: docker compose up -d

      - name: Wait for services to become ready
        run: |
          echo "Polling public endpoint until /ready returns HTTP 200..."
          # Bounded 60s timeout polling the internal health check logic
          timeout 60 bash -c 'while ! curl -s -f http://localhost:8090/ready > /dev/null; do sleep 3; done'
          echo "Services are healthy and reachable."

      - name: Run validation script
        run: python3 validate.py

      - name: Cleanup environment
        if: always()
        run: |
          echo "Tearing down the environment..."
          docker compose down -v --remove-orphans
